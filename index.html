<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vivienda A · Modelo 3D</title>
<style>
:root{--bg:#edf0f2;--panel:rgba(255,255,255,.93);--ink:#1f2933;--mut:#64707c;--acc:#2f5d8a;--line:#d5dbe0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
#app{position:fixed;inset:0;touch-action:none}
#app canvas{display:block}
#css2d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.panel{position:absolute;background:var(--panel);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#ui{top:12px;left:12px;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 24px))}
#ui h1{font-size:14px;margin:0 0 2px}
#ui .sub{color:var(--mut);font-size:12px;margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-right:1px solid var(--line);background:#fff;padding:7px 6px;cursor:pointer;font:inherit;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit;color:var(--ink)}
.btn:hover{border-color:#aab4bd}
.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label.s{display:flex;align-items:center;gap:8px;color:var(--mut)}
label.s span{min-width:104px}
label.s input[type=range]{flex:1;min-width:0}
label.s output{min-width:42px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
#info{top:12px;right:12px;width:min(300px,calc(100vw - 24px));max-height:calc(100% - 24px);overflow:auto}
#info h2{font-size:13px;margin:0 0 4px}
#info .big{font-size:15px;font-weight:600}
#info .mut{color:var(--mut)}
#info table{border-collapse:collapse;width:100%;margin-top:6px}
#info td{padding:2px 0;font-variant-numeric:tabular-nums}
#info td:last-child{text-align:right}
#info details{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
#info summary{cursor:pointer;font-weight:600}
#info ul{margin:6px 0 0;padding-left:16px;color:#3e4a56}
#info li{margin:3px 0}
.hint{color:var(--mut);font-size:12px}
#scalebar{position:absolute;left:14px;bottom:14px;display:none;color:#0b4a8f;font-size:11px}
#scalebar i{display:block;height:7px;border:2px solid #0b4a8f;border-top:0;margin-bottom:2px}
#pad{position:absolute;right:14px;bottom:14px;display:none;grid-template-columns:repeat(3,46px);grid-auto-rows:46px;gap:6px}
#pad button{border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:18px;cursor:pointer;touch-action:none;user-select:none}
#walkhint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;max-width:calc(100vw - 180px)}
.room-label{font-size:11px;font-weight:600;color:#26323d;text-align:center;line-height:1.15;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap}
.room-label small{display:block;font-weight:400;color:#4b5966}
.cota{font-size:10px;color:#0b4a8f;background:rgba(255,255,255,.88);padding:0 3px;border-radius:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cota.w{color:#8a3512}
#err{position:absolute;left:12px;bottom:12px;color:#a31d1d;background:#fff;border:1px solid #e4b5b5;border-radius:8px;padding:8px 10px;display:none;max-width:60ch}

.panel,#scalebar,#pad{z-index:20}
#css2d{z-index:1}
.tg{position:absolute;top:8px;right:8px;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;font-size:14px;line-height:1;padding:0}
#ui{max-height:calc(100% - 24px);overflow:auto}
#ui h1,#ui .sub,#info h2{padding-right:34px}
#ui.min .sub{display:none}
@media (max-width:700px){
  #ui{width:calc(100vw - 24px);max-height:62vh}
  #info{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:45vh}
  #scalebar{bottom:72px}
  body.walking #info{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="css2d"></div>

<div id="ui" class="panel">
  <div>
    <h1 id="ttl">Modelo 3D</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="seg" id="modes">
    <button data-mode="model" class="on">Modelo</button>
    <button data-mode="plan">Plano original</button>
    <button data-mode="furn">Mobiliario</button>
  </div>
  <div class="row">
    <button class="btn" id="b-top">Vista cenital</button>
    <button class="btn" id="b-iso">Isométrica</button>
    <button class="btn" id="b-walk">Recorrido</button>
    <button class="btn" id="b-glass">Muros transparentes</button>
  </div>
  <label class="s"><span>Altura de muros</span><input type="range" id="r-h" min="2.2" max="3.2" step="0.05" value="2.6"><output id="o-h">2,60 m</output></label>
  <label class="s" id="l-op" style="display:none"><span>Opacidad del plano</span><input type="range" id="r-op" min="0" max="100" step="1" value="55"><output id="o-op">55 %</output></label>
  <div class="row" id="r-cotas" style="display:none">
    <button class="btn on" id="b-cw">Cotas de muros</button>
    <button class="btn on" id="b-cr">Cotas de estancias</button>
  </div>
</div>

<div id="info" class="panel">
  <h2>Estancia</h2>
  <div id="sel"><span class="hint">Haz clic en una habitación para ver su nombre y superficie.</span></div>
  <div id="tot"></div>
  <details>
    <summary>Supuestos y zonas dudosas</summary>
    <ul id="assump"></ul>
  </details>
</div>

<div id="scalebar"><i id="sb-line"></i><span>1 m</span></div>
<div id="walkhint" class="panel hint">Arrastra para mirar · W A S D / flechas para moverte · Mayús para correr · Esc para salir</div>
<div id="pad">
  <span></span><button data-k="w">▲</button><span></span>
  <button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button>
</div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = (id) => document.getElementById(id);
window.addEventListener('error', (e) => { const el = $('err'); el.style.display = 'block'; el.textContent = 'Error: ' + e.message; });

const S = SCENE;
if (S.meta) { $('ttl').textContent = S.meta.title; $('sub').textContent = S.meta.subtitle; document.title = S.meta.title + ' · Modelo 3D'; }
const PPM = S.plan_image.px_per_m;
const PLAN_W = S.plan_image.size_px[0] / PPM, PLAN_H = S.plan_image.size_px[1] / PPM;
let H = S.wall_height;
const fmt = (v, d = 2) => v.toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });

/* ---------- límites y utilidades ---------- */
const bb = { minx: 1e9, minz: 1e9, maxx: -1e9, maxz: -1e9 };
const ext = (x, z) => { bb.minx = Math.min(bb.minx, x); bb.maxx = Math.max(bb.maxx, x); bb.minz = Math.min(bb.minz, z); bb.maxz = Math.max(bb.maxz, z); };
S.rooms.forEach(r => r.polygon.forEach(p => ext(p[0], p[1])));
S.walls.forEach(w => { ext(w.a[0], w.a[1]); ext(w.b[0], w.b[1]); });
const CX = (bb.minx + bb.maxx) / 2, CZ = (bb.minz + bb.maxz) / 2;
const SPAN_X = bb.maxx - bb.minx, SPAN_Z = bb.maxz - bb.minz;
const polyArea = (p) => { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.abs(s) / 2; };
// tramo interior más largo de un polígono al cortarlo con una recta (axis 0: z=v, axis 1: x=v)
function scan(poly, axis, v) {
  const xs = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const a0 = a[1 - axis], b0 = b[1 - axis], a1 = a[axis], b1 = b[axis];
    if ((a0 <= v && b0 > v) || (b0 <= v && a0 > v)) xs.push(a1 + (v - a0) / (b0 - a0) * (b1 - a1));
  }
  xs.sort((p, q) => p - q);
  let best = null;
  for (let i = 0; i + 1 < xs.length; i += 2) if (!best || xs[i + 1] - xs[i] > best[1] - best[0]) best = [xs[i], xs[i + 1]];
  return best;
}

/* ---------- renderer, cámaras, controles ---------- */
const app = $('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: $('css2d') });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xedf0f2);

const persp = new THREE.PerspectiveCamera(45, 1, 0.05, 250);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 120);
ortho.up.set(0, 0, -1);

const ctlP = new OrbitControls(persp, renderer.domElement);
ctlP.enableDamping = true; ctlP.dampingFactor = 0.08;
ctlP.maxPolarAngle = Math.PI / 2 - 0.03; ctlP.minDistance = 1.5; ctlP.maxDistance = 45;
const ctlO = new OrbitControls(ortho, renderer.domElement);
ctlO.enableRotate = false; ctlO.screenSpacePanning = true; ctlO.enableDamping = true;
ctlO.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
ctlO.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN };
ctlO.minZoom = 0.4; ctlO.maxZoom = 8;

let active = 'p';           // 'p' perspectiva | 'o' ortográfica | 'walk'
let walking = false;
let mode = 'model';
const activeCam = () => (active === 'o' ? ortho : persp);

function fitOrtho() {
  const w = app.clientWidth, h = app.clientHeight, asp = w / h;
  const halfH = Math.max(SPAN_Z * 0.58, (SPAN_X * 0.58) / asp);
  ortho.left = -halfH * asp; ortho.right = halfH * asp; ortho.top = halfH; ortho.bottom = -halfH;
  ortho.updateProjectionMatrix();
}
function goTop() {
  stopWalk();
  active = 'o';
  ctlP.enabled = false; ctlO.enabled = true;
  fitOrtho(); ortho.zoom = 1; ortho.updateProjectionMatrix();
  ctlO.target.set(CX, 0, CZ);
  ortho.position.set(CX, 40, CZ); ortho.lookAt(CX, 0, CZ);
  ctlO.update();
  setActiveButtons();
}
function goIso() {
  stopWalk();
  active = 'p';
  ctlP.enabled = true; ctlO.enabled = false;
  const R = Math.max(SPAN_X, SPAN_Z) * 1.0;
  persp.position.set(CX + R * 0.22, R * 1.55, CZ + R * 0.62);
  ctlP.target.set(CX, 0.3, CZ);
  ctlP.update();
  setActiveButtons();
}
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  persp.aspect = w / h; persp.updateProjectionMatrix();
  const z = ortho.zoom; fitOrtho(); ortho.zoom = z; ortho.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ---------- luces ---------- */
scene.add(new THREE.HemisphereLight(0xffffff, 0xaab2ba, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 0.95);
sun.position.set(CX + 2, 24, CZ + 3.5);
sun.target.position.set(CX, 0, CZ);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const SR = Math.max(SPAN_X, SPAN_Z) * 0.62;
Object.assign(sun.shadow.camera, { left: -SR, right: SR, top: SR, bottom: -SR, near: 0.5, far: 70 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02; sun.shadow.radius = 3;
scene.add(sun, sun.target);

/* ---------- materiales ---------- */
const C = { off: 0xF2F0EB, warm: 0xB9B4AB, wood: 0xC9A67A, dark: 0x2F3437 };
const std = (color, rough = 0.85, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough, metalness: 0 }, extra));
const M = {
  wall: std(0xd9d5cc, 0.92),
  closet: std(0xe4e0d8, 0.85),
  glass: std(0x9fc4dc, 0.1, { transparent: true, opacity: 0.28, depthWrite: false }),
  rail: std(0x9fb4c4, 0.2, { transparent: true, opacity: 0.35, depthWrite: false }),
  door: std(0xe9e5dd, 0.8),
  frame: std(0x4b5258, 0.6),
  off: std(C.off, 0.8), warm: std(C.warm, 0.85), wood: std(C.wood, 0.75), dark: std(C.dark, 0.7),
  green: std(0x86a07a, 0.9), thresh: std(0xcfc0a4, 0.9),
};
const FLOOR = { madera: 0xcfc0a4, azulejo: 0xb5bbc0, terraza: 0xb99e72, exterior: 0xc6ad84 };
const WALL_COLOR = 0xd9d5cc, WALL_PLAN = 0xe4572e;

/* ---------- grupos ---------- */
const gS = new THREE.Group();      // estructura (muros, bloques, puertas, ventanas, armarios, barandillas)
const gF = new THREE.Group();      // suelos de habitación
const gM = new THREE.Group();      // mobiliario
const gL = new THREE.Group();      // etiquetas de estancia
const gC = new THREE.Group();      // cotas
scene.add(gS, gF, gM, gL, gC);
// CSS2DObject no hereda la visibilidad del grupo padre: se propaga a mano
function setVis(group, v) { group.visible = v; group.traverse(o => { if (o.isCSS2DObject) o.visible = v; }); }

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), std(0xe3e6e8, 1));
ground.rotation.x = -Math.PI / 2; ground.position.set(CX, -0.03, CZ); ground.receiveShadow = true;
scene.add(ground);

/* ---------- colisiones (en planta, metros) ---------- */
const colliders = { struct: [], furn: [] };

function box(group, x0, z0, x1, z1, y0, y1, mat, collide = true, list = colliders.struct, cast = true) {
  const w = x1 - x0, d = z1 - z0, h = y1 - y0;
  if (w < 1e-3 || d < 1e-3 || h < 1e-3) return null;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  mesh.castShadow = cast; mesh.receiveShadow = true;
  group.add(mesh);
  if (collide && y0 < 1.5 && y1 > 0.3) list.push([x0, z0, x1, z1]);
  return mesh;
}

/* ---------- estructura ---------- */
function buildWall(w) {
  const horiz = Math.abs(w.b[0] - w.a[0]) >= Math.abs(w.b[1] - w.a[1]);
  const t = w.thickness;
  const L = horiz ? w.b[0] - w.a[0] : w.b[1] - w.a[1];
  const base = horiz ? w.a[0] : w.a[1];     // coordenada a lo largo del eje en offset 0
  const c = horiz ? w.a[1] : w.a[0];        // coordenada fija
  const seg = (from, to, y0, y1) => {
    if (to - from < 1e-3) return;
    if (horiz) box(gS, base + from, c - t / 2, base + to, c + t / 2, y0, y1, M.wall);
    else box(gS, c - t / 2, base + from, c + t / 2, base + to, y0, y1, M.wall);
  };
  let cur = -t / 2;
  const ops = [...(w.openings || [])].sort((p, q) => p.offset - q.offset);
  for (const o of ops) {
    seg(cur, o.offset, 0, H);
    const sill = o.sill || 0, top = Math.min(sill + o.height, H);
    seg(o.offset, o.offset + o.width, top, H);                  // dintel
    if (sill > 0) seg(o.offset, o.offset + o.width, 0, sill);   // antepecho
    const mid = base + o.offset + o.width / 2;
    if (o.type === 'door' || (o.type === 'window' && !(o.sill > 0))) {
      const th = new THREE.Mesh(new THREE.BoxGeometry(horiz ? o.width : t, 0.014, horiz ? t : o.width), M.thresh);
      th.position.set(horiz ? mid : c, 0.007, horiz ? c : mid); th.receiveShadow = true; gS.add(th);
    }
    if (o.type === 'window') {
      const gh = top - sill;
      const gx = horiz ? mid : c, gz = horiz ? c : mid;
      const glass = new THREE.Mesh(new THREE.BoxGeometry(horiz ? o.width : 0.02, gh, horiz ? 0.02 : o.width), M.glass);
      glass.position.set(gx, sill + gh / 2, gz); glass.renderOrder = 2; gS.add(glass);
      if (!(sill > 0)) colliders.struct.push(horiz ? [base + o.offset, c - t / 2, base + o.offset + o.width, c + t / 2] : [c - t / 2, base + o.offset, c + t / 2, base + o.offset + o.width]);
      const fr = (fx, fy, fz, sx, sy, sz) => { const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), M.frame); m.position.set(fx, fy, fz); gS.add(m); };
      const fw = 0.04;
      if (horiz) { fr(gx, sill + fw / 2, gz, o.width, fw, 0.06); fr(gx, top - fw / 2, gz, o.width, fw, 0.06); fr(gx - o.width / 2 + fw / 2, sill + gh / 2, gz, fw, gh, 0.06); fr(gx + o.width / 2 - fw / 2, sill + gh / 2, gz, fw, gh, 0.06); if (o.width > 1.3) fr(gx, sill + gh / 2, gz, fw, gh, 0.06); }
      else { fr(gx, sill + fw / 2, gz, 0.06, fw, o.width); fr(gx, top - fw / 2, gz, 0.06, fw, o.width); fr(gx, sill + gh / 2, gz - o.width / 2 + fw / 2, 0.06, gh, fw); fr(gx, sill + gh / 2, gz + o.width / 2 - fw / 2, 0.06, gh, fw); }
    } else if (o.type === 'door') {
      // hoja abierta ~70° sobre el lado de giro
      const u = horiz ? [1, 0] : [0, 1], n = horiz ? [0, 1] : [1, 0];
      const hingeAt = o.hinge === 'start' ? base + o.offset : base + o.offset + o.width;
      const hp = horiz ? [hingeAt, c] : [c, hingeAt];
      const d0 = o.hinge === 'start' ? [u[0], u[1]] : [-u[0], -u[1]];
      const phi = 70 * Math.PI / 180;
      const d = [d0[0] * Math.cos(phi) + o.swing * n[0] * Math.sin(phi), d0[1] * Math.cos(phi) + o.swing * n[1] * Math.sin(phi)];
      const piv = new THREE.Group();
      piv.position.set(hp[0], 0, hp[1]);
      piv.rotation.y = Math.atan2(-d[1], d[0]);
      const leaf = new THREE.Mesh(new THREE.BoxGeometry(o.width, Math.min(o.height - 0.02, H - 0.02), 0.04), M.door);
      leaf.position.set(o.width / 2, Math.min(o.height - 0.02, H - 0.02) / 2, 0);
      leaf.castShadow = true; leaf.receiveShadow = true;
      piv.add(leaf); gS.add(piv);
    }
    cur = o.offset + o.width;
  }
  seg(cur, L + t / 2, 0, H);
}

function buildStructure() {
  gS.clear();
  colliders.struct.length = 0;
  S.walls.forEach(buildWall);
  S.blocks.forEach(b => box(gS, b.rect[0], b.rect[1], b.rect[2], b.rect[3], 0, H, M.wall));
  S.closets.forEach(c => {
    const [x0, z0, x1, z1] = c.rect;
    box(gS, x0, z0, x1, z1, 0, Math.min(c.height, H - 0.05), M.closet);
    // ranuras de puertas en la cara frontal
    const ch = Math.min(c.height, H - 0.05);
    const horizFront = (c.front === 's' || c.front === 'n');
    const len = horizFront ? x1 - x0 : z1 - z0;
    const n = Math.max(2, Math.round(len / 0.55));
    for (let i = 1; i < n; i++) {
      const f = i / n;
      let g;
      if (c.front === 's') g = box(gS, x0 + len * f - 0.004, z1, x0 + len * f + 0.004, z1 + 0.004, 0.05, ch - 0.05, M.frame, false);
      else if (c.front === 'n') g = box(gS, x0 + len * f - 0.004, z0 - 0.004, x0 + len * f + 0.004, z0, 0.05, ch - 0.05, M.frame, false);
      else if (c.front === 'e') g = box(gS, x1, z0 + len * f - 0.004, x1 + 0.004, z0 + len * f + 0.004, 0.05, ch - 0.05, M.frame, false);
      else g = box(gS, x0 - 0.004, z0 + len * f - 0.004, x0, z0 + len * f + 0.004, 0.05, ch - 0.05, M.frame, false);
    }
  });
  S.rails.forEach(r => {
    if (r.solid) { box(gS, r.rect[0], r.rect[1], r.rect[2], r.rect[3], 0, r.height || 1.2, M.wall); return; }
    box(gS, r.rect[0], r.rect[1], r.rect[2], r.rect[3], 0, 1.02, M.rail);
    box(gS, r.rect[0], r.rect[1], r.rect[2], r.rect[3], 1.02, 1.06, M.frame, false);
  });
  applyStructLook();
}

function applyStructLook() {
  gS.scale.y = (mode === 'plan') ? 0.02 : 1;
  M.wall.color.setHex(mode === 'plan' ? WALL_PLAN : WALL_COLOR);
  M.closet.color.setHex(mode === 'plan' ? 0xf08a5d : 0xe4e0d8);
}

/* ---------- suelos y etiquetas ---------- */
const floorMeshes = [];
function buildFloors() {
  S.rooms.forEach((r, i) => {
    const shape = new THREE.Shape(r.polygon.map(p => new THREE.Vector2(p[0], -p[1])));
    const geo = new THREE.ShapeGeometry(shape); geo.rotateX(-Math.PI / 2);
    const mat = std(FLOOR[r.floor] || FLOOR.madera, 0.9);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 0.0; mesh.receiveShadow = true; mesh.userData.room = i;
    gF.add(mesh); floorMeshes.push(mesh);
    r._area = polyArea(r.polygon);
    const div = document.createElement('div');
    div.className = 'room-label';
    div.innerHTML = r.name + (r._area > 3 ? '<small>' + fmt(r._area) + ' m²</small>' : '');
    const lab = new CSS2DObject(div);
    lab.position.set(r.label[0], 0.06, r.label[1]);
    gL.add(lab);
  });
}

/* ---------- mobiliario (formas simples, paleta de 4 tonos) ---------- */
const RB = (w, h, d, r = 0.015) => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001));
function part(parent, w, h, d, x, y, z, mat, r) {
  const m = new THREE.Mesh(RB(w, h, d, r), mat);
  m.position.set(x, y + h / 2, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
// grupo local con "espalda" al norte (-z local); w = ancho local, d = fondo local
function oriented(f) {
  const [x0, z0, x1, z1] = f.rect, sx = x1 - x0, sz = z1 - z0;
  const back = f.back || 'n';
  const swap = (back === 'e' || back === 'w');
  const g = new THREE.Group();
  g.position.set((x0 + x1) / 2, 0, (z0 + z1) / 2);
  g.rotation.y = { n: 0, w: Math.PI / 2, s: Math.PI, e: -Math.PI / 2 }[back] + (f.rot || 0) * Math.PI / 180;
  return { g, w: swap ? sz : sx, d: swap ? sx : sz, sx, sz };
}

};
function buildFurniture() {
  gM.clear(); colliders.furn.length = 0;
  S.furniture.forEach(f => { if (FURN[f.type]) FURN[f.type](f); });
  // las sillas se colocan por su rectángulo del plano
  gM.children.forEach(() => {});
}

/* ---------- plano original superpuesto + cotas ---------- */
let overlay = null;
function buildOverlay() {
  const tex = new THREE.TextureLoader().load(window.PLAN_IMG_SRC, () => {});
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.55, depthWrite: false, toneMapped: false });
  overlay = new THREE.Mesh(new THREE.PlaneGeometry(PLAN_W, PLAN_H), mat);
  overlay.rotation.x = -Math.PI / 2;
  overlay.position.set(S.plan_image.origin_px[0] / PPM + PLAN_W / 2, 0.06, S.plan_image.origin_px[1] / PPM + PLAN_H / 2);
  overlay.renderOrder = 5; overlay.visible = false;
  scene.add(overlay);
}
const cotaLineMat = new THREE.LineBasicMaterial({ color: 0x0b4a8f, depthTest: false, transparent: true });
const gCW = new THREE.Group(), gCR = new THREE.Group();
gC.add(gCW, gCR);
function cotaLabel(group, x, z, text, cls = '') {
  const d = document.createElement('div'); d.className = 'cota ' + cls; d.textContent = text;
  const o = new CSS2DObject(d); o.position.set(x, 0.08, z); group.add(o);
}
function cotaLine(group, x0, z0, x1, z1) {
  const pts = [new THREE.Vector3(x0, 0.075, z0), new THREE.Vector3(x1, 0.075, z1)];
  const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), cotaLineMat); ln.renderOrder = 9; group.add(ln);
  // marcas de extremo
  const dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz) || 1, nx = -dz / L * 0.06, nz = dx / L * 0.06;
  for (const [px, pz] of [[x0, z0], [x1, z1]]) {
    const t = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(px - nx, 0.075, pz - nz), new THREE.Vector3(px + nx, 0.075, pz + nz)]), cotaLineMat);
    t.renderOrder = 9; group.add(t);
  }
}
function buildCotas() {
  // longitud de cada muro (calculada desde la escena, 2 decimales)
  S.walls.forEach(w => {
    const horiz = Math.abs(w.b[0] - w.a[0]) >= Math.abs(w.b[1] - w.a[1]);
    const L = (horiz ? w.b[0] - w.a[0] : w.b[1] - w.a[1]) + w.thickness;
    if (L < 0.8) return;
    const mx = (w.a[0] + w.b[0]) / 2, mz = (w.a[1] + w.b[1]) / 2;
    cotaLabel(gCW, mx, mz, fmt(L) + ' m', 'w');
  });
  // ancho x largo de cada estancia (corte interior a través de la estancia)
  S.rooms.forEach(r => {
    const xs = r.polygon.map(p => p[0]), zs = r.polygon.map(p => p[1]);
    const minx = Math.min(...xs), maxx = Math.max(...xs), minz = Math.min(...zs), maxz = Math.max(...zs);
    const zh = minz + (maxz - minz) * 0.78, xv = minx + (maxx - minx) * 0.2;
    const h = scan(r.polygon, 0, zh), v = scan(r.polygon, 1, xv);
    if (h) { cotaLine(gCR, h[0], zh, h[1], zh); cotaLabel(gCR, (h[0] + h[1]) / 2, zh - 0.1, fmt(h[1] - h[0]) + ' m'); }
    if (v) { cotaLine(gCR, xv, v[0], xv, v[1]); cotaLabel(gCR, xv + 0.32, (v[0] + v[1]) / 2, fmt(v[1] - v[0]) + ' m'); }
  });
}

/* ---------- panel de información ---------- */
let selected = -1;
function showRoom(i) {
  if (selected >= 0) floorMeshes[selected].material.emissive.setHex(0x000000);
  selected = i;
  if (i < 0) { $('sel').innerHTML = '<span class="hint">Haz clic en una habitación para ver su nombre y superficie.</span>'; return; }
  floorMeshes[i].material.emissive.setHex(0x2a5ea8);
  floorMeshes[i].material.emissiveIntensity = 0.35;
  const r = S.rooms[i], d = (r._area / r.area_label - 1) * 100;
  $('sel').innerHTML = '<div class="big">' + r.name + '</div><table>' +
    '<tr><td class="mut">Superficie (modelo)</td><td><b>' + fmt(r._area) + ' m²</b></td></tr>' +
    '<tr><td class="mut">Superficie (plano)</td><td>' + fmt(r.area_label) + ' m²</td></tr>' +
    '<tr><td class="mut">Diferencia</td><td>' + (d >= 0 ? '+' : '') + fmt(d, 1) + ' %</td></tr>' +
    '<tr><td class="mut">Tipo</td><td>' + (r.outdoor ? 'exterior' : 'interior') + '</td></tr></table>';
}
function showTotals() {
  const inn = S.rooms.filter(r => !r.outdoor);
  const tot = inn.reduce((a, r) => a + r._area, 0), lab = (S.meta && S.meta.interior_label) || inn.reduce((a, r) => a + r.area_label, 0);
  $('tot').innerHTML = '<table><tr><td class="mut">Útil interior (modelo)</td><td><b>' + fmt(tot) + ' m²</b></td></tr>' +
    '<tr><td class="mut">Útil interior (plano)</td><td>' + fmt(lab) + ' m²</td></tr></table>';
  $('assump').innerHTML = S.assumptions.map(a => '<li>' + a + '</li>').join('');
}

/* ---------- construcción ---------- */
buildStructure(); buildFloors(); buildFurniture(); buildOverlay(); buildCotas(); showTotals();

/* ---------- modos ---------- */
function setMode(m) {
  mode = m;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  gM.visible = (m === 'furn');
  overlay.visible = (m === 'plan');
  updateCotas();
  setVis(gL, (m !== 'plan') && !walking);
  ground.visible = (m !== 'plan');
  $('l-op').style.display = (m === 'plan') ? 'flex' : 'none';
  $('r-cotas').style.display = (m === 'plan') ? 'flex' : 'none';
  applyStructLook();
  if (m === 'plan') goTop();
  else if (active === 'o' && !walking) { /* se mantiene la cenital */ }
  setActiveButtons();
}
function setActiveButtons() {
  $('b-top').classList.toggle('on', active === 'o' && !walking);
  $('b-iso').classList.toggle('on', active === 'p' && !walking);
  $('b-walk').classList.toggle('on', walking);
}
document.querySelectorAll('#modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('b-top').addEventListener('click', goTop);
$('b-iso').addEventListener('click', goIso);
let glassOn = false;
$('b-glass').addEventListener('click', () => {
  glassOn = !glassOn; $('b-glass').classList.toggle('on', glassOn);
  [M.wall, M.closet].forEach(mm => { mm.transparent = glassOn; mm.opacity = glassOn ? 0.3 : 1; mm.depthWrite = !glassOn; mm.needsUpdate = true; });
});
$('r-h').addEventListener('input', e => { H = parseFloat(e.target.value); $('o-h').textContent = fmt(H) + ' m'; buildStructure(); });
$('r-op').addEventListener('input', e => { overlay.material.opacity = e.target.value / 100; $('o-op').textContent = e.target.value + ' %'; });
let cotaW = true, cotaR = true;
function updateCotas() { setVis(gCW, mode === 'plan' && cotaW); setVis(gCR, mode === 'plan' && cotaR); }
$('b-cw').addEventListener('click', () => { cotaW = !cotaW; $('b-cw').classList.toggle('on', cotaW); updateCotas(); });
$('b-cr').addEventListener('click', () => { cotaR = !cotaR; $('b-cr').classList.toggle('on', cotaR); updateCotas(); });

/* ---------- selección de estancias (clic sin arrastre) ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || walking) return;
  const moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]); down = null;
  if (moved > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, activeCam());
  const hit = ray.intersectObjects(floorMeshes, false)[0];
  showRoom(hit ? hit.object.userData.room : -1);
});

/* ---------- recorrido en primera persona ---------- */
const EYE = 1.65, RAD = 0.22;
const walk = { x: 0, z: 0, yaw: Math.PI, pitch: 0 };
const keys = {};
function startWalk() {
  walking = true; active = 'walk'; document.body.classList.add('walking');
  ctlP.enabled = false; ctlO.enabled = false;
  const st = S.walk_start;
  walk.x = st[0]; walk.z = st[1]; walk.yaw = st[2]; walk.pitch = 0;
  persp.rotation.order = 'YXZ';
  persp.position.set(walk.x, EYE, walk.z);
  persp.rotation.set(0, walk.yaw, 0);
  setVis(gL, false); $('walkhint').style.display = 'block'; $('pad').style.display = 'grid';
  setActiveButtons();
}
function stopWalk() {
  if (!walking) return;
  walking = false; active = 'p'; document.body.classList.remove('walking');
  persp.rotation.order = 'XYZ';
  $('walkhint').style.display = 'none'; $('pad').style.display = 'none';
  setVis(gL, mode !== 'plan');
}
$('b-walk').addEventListener('click', () => { if (walking) { stopWalk(); goIso(); } else startWalk(); });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && walking) { stopWalk(); goIso(); return; }
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
let look = null;
renderer.domElement.addEventListener('pointerdown', e => { if (walking) look = [e.clientX, e.clientY]; });
window.addEventListener('pointerup', () => { look = null; });
window.addEventListener('pointermove', e => {
  if (!walking || !look) return;
  walk.yaw -= (e.clientX - look[0]) * 0.004;
  walk.pitch = Math.max(-1.2, Math.min(1.2, walk.pitch - (e.clientY - look[1]) * 0.004));
  look = [e.clientX, e.clientY];
});
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; }, off = () => { keys[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});
function blocked(x, z) {
  const list = colliders.struct.concat(mode === 'furn' ? colliders.furn : []);
  for (const b of list) if (x > b[0] - RAD && x < b[2] + RAD && z > b[1] - RAD && z < b[3] + RAD) return true;
  return false;
}
function stepWalk(dt) {
  const sp = (keys['shift'] ? 3.2 : 1.6) * dt;
  let f = 0, s = 0;
  if (keys['w'] || keys['arrowup']) f += 1;
  if (keys['s'] || keys['arrowdown']) f -= 1;
  if (keys['d']) s += 1;
  if (keys['a']) s -= 1;
  if (keys['arrowleft']) walk.yaw += 1.6 * dt;
  if (keys['arrowright']) walk.yaw -= 1.6 * dt;
  if (f || s) {
    const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw), rx = Math.cos(walk.yaw), rz = -Math.sin(walk.yaw);
    const dx = (fx * f + rx * s) * sp, dz = (fz * f + rz * s) * sp;
    if (!blocked(walk.x + dx, walk.z)) walk.x += dx;
    if (!blocked(walk.x, walk.z + dz)) walk.z += dz;
  }
  persp.position.set(walk.x, EYE, walk.z);
  persp.rotation.set(walk.pitch, walk.yaw, 0);
}

/* ---------- paneles plegables (en móvil arrancan cerrados) ---------- */
const isMobile = window.matchMedia('(max-width: 700px)').matches;
function collapsible(panel, head, startCollapsed) {
  const body = document.createElement('div');
  Array.from(panel.children).filter(c => c !== head).forEach(c => body.appendChild(c));
  panel.appendChild(body);
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'tg';
  panel.insertBefore(btn, panel.firstChild);
  const set = (c) => { body.style.display = c ? 'none' : ''; panel.classList.toggle('min', c); btn.textContent = c ? '▾' : '▴'; btn.setAttribute('aria-expanded', String(!c)); btn.title = c ? 'Mostrar panel' : 'Ocultar panel'; };
  btn.addEventListener('click', () => set(body.style.display !== 'none'));
  set(startCollapsed);
}
collapsible($('ui'), $('ui').firstElementChild, isMobile);
const infoHead = $('info').querySelector('h2');
collapsible($('info'), infoHead, isMobile);
function updInfoHead() { infoHead.textContent = selected >= 0 ? S.rooms[selected].name + ' · ' + fmt(S.rooms[selected]._area) + ' m²' : 'Estancia'; }
const _showRoom = showRoom; showRoom = (i) => { _showRoom(i); updInfoHead(); };

/* ---------- bucle ---------- */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (walking) stepWalk(dt);
  else if (active === 'o') ctlO.update(); else ctlP.update();
  const cam = activeCam();
  renderer.render(scene, cam);
  labelRenderer.render(scene, cam);
  if (active === 'o') {
    const pxm = renderer.domElement.clientHeight / ((ortho.top - ortho.bottom) / ortho.zoom);
    $('scalebar').style.display = 'block'; $('sb-line').style.width = pxm + 'px';
  } else $('scalebar').style.display = 'none';
  requestAnimationFrame(frame);
}
resize();
setMode('model');
goIso();
frame();

// utilidades de prueba
window.__viewer = { setMode, goTop, goIso, startWalk, stopWalk, showRoom, walk, scene, S, blocked, ortho, ctlO, persp, ctlP };
</script>
</body>
</html>
